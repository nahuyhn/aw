<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Khách Cọc - Aleyna Wedding</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #F4F7F6;
            margin: 0; padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        h2 { text-align: center; color: #FF69B4; margin-top: 0; }
        
        .add-box {
            display: flex; gap: 10px; margin-bottom: 30px;
            background: #FFF0F5; padding: 20px; border-radius: 10px;
        }
        .add-box input {
            flex: 1; padding: 12px; border: 1px solid #FFB6C1;
            border-radius: 6px; font-size: 16px; outline: none;
        }
        .add-box button {
            padding: 12px 25px; background: #FF69B4; color: #fff;
            border: none; border-radius: 6px; font-weight: bold;
            cursor: pointer; font-size: 16px; transition: 0.3s;
        }
        .add-box button:hover { background: #E0529C; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #FF69B4; color: white; font-weight: 600; }
        tr:hover { background-color: #fcfcfc; }
        
        .badge {
            padding: 5px 10px; border-radius: 20px; font-size: 13px; font-weight: bold;
        }
        .badge.chua-quay { background: #E2E8F0; color: #64748B; }
        .badge.da-quay { background: #DCFCE7; color: #16A34A; }
    </style>
</head>
<body>

<div class="container">
    <h2>Aleyna Wedding - Quản Lý Khách Cọc</h2>
    
    <div class="add-box">
        <input type="text" id="newPhone" placeholder="Nhập SĐT khách vừa cọc...">
        <button id="addBtn" onclick="addPhone()">THÊM SĐT</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Số Điện Thoại</th>
                <th>Trạng Thái</th>
                <th>Quà Trúng</th>
                <th>Thời Gian Quay</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="4" style="text-align:center;">Đang tải dữ liệu...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // === DÁN LINK GOOGLE SCRIPT CỦA BẠN VÀO ĐÂY ===
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxVILftDIjiuqkLuhZyjJVvSC22Q8O7djkUp41GfwJKa9HB4Wf0yEFpCZy1ZU8sJYVW/exec'; 

    // Tự động tải dữ liệu khi mở trang
    window.onload = loadData;

    async function loadData() {
        const tbody = document.getElementById('tableBody');
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'getData' })
            });
            const res = await response.json();
            
            if(res.status === 'success') {
                tbody.innerHTML = '';
                if(res.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Chưa có dữ liệu</td></tr>';
                    return;
                }
                
                res.data.forEach(item => {
                    let badgeClass = item.status === 'Đã quay' ? 'badge da-quay' : 'badge chua-quay';
                    tbody.innerHTML += `
                        <tr>
                            <td><b>${item.phone}</b></td>
                            <td><span class="${badgeClass}">${item.status}</span></td>
                            <td><span style="color: #D81B60; font-weight: 600;">${item.prize}</span></td>
                            <td>${item.time}</td>
                        </tr>
                    `;
                });
            }
        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:red;">Lỗi kết nối dữ liệu!</td></tr>';
        }
    }

    async function addPhone() {
        const phone = document.getElementById('newPhone').value.trim();
        const btn = document.getElementById('addBtn');
        
        if(!phone) {
            Swal.fire('Thiếu thông tin', 'Vui lòng nhập số điện thoại', 'warning');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'Đang thêm...';

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'addPhone', phone: phone })
            });
            const res = await response.json();

            if (res.status === 'success') {
                Swal.fire('Thành công', 'Đã thêm SĐT vào danh sách!', 'success');
                document.getElementById('newPhone').value = '';
                loadData(); // Tải lại bảng ngay lập tức
            } else {
                Swal.fire('Lỗi', res.message, 'error');
            }
        } catch (error) {
            Swal.fire('Lỗi', 'Không kết nối được với máy chủ', 'error');
        }
        
        btn.disabled = false;
        btn.innerText = 'THÊM SĐT';
    }
</script>

</body>
</html>
