<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aleyna Wedding - Vòng Quay May Mắn</title>
    <!-- Thư viện Font chữ và Popup -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-pink: #FFB6C1;
            --dark-pink: #FF69B4;
            --text-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* =========================================
           HIỆU ỨNG SLIDESHOW 10 ẢNH NỀN
           ========================================= */
        .bg-slideshow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-color: #000; 
        }

        .bg-slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            /* 10 ảnh x 5s/ảnh = 50s tổng chu kỳ */
            animation: fadeZoom 50s infinite; 
        }

        .slide-1 { background-image: url('bg1.jpg'); animation-delay: 0s; }
        .slide-2 { background-image: url('bg2.jpg'); animation-delay: 5s; }
        .slide-3 { background-image: url('bg3.jpg'); animation-delay: 10s; }
        .slide-4 { background-image: url('bg4.jpg'); animation-delay: 15s; }
        .slide-5 { background-image: url('bg5.jpg'); animation-delay: 20s; }
        .slide-6 { background-image: url('bg6.jpg'); animation-delay: 25s; }
        .slide-7 { background-image: url('bg7.jpg'); animation-delay: 30s; }
        .slide-8 { background-image: url('bg8.jpg'); animation-delay: 35s; }
        .slide-9 { background-image: url('bg9.jpg'); animation-delay: 40s; }
        .slide-10 { background-image: url('bg10.jpg'); animation-delay: 45s; }

        @keyframes fadeZoom {
            0% { opacity: 0; transform: scale(1); }
            2% { opacity: 1; }
            8% { opacity: 1; transform: scale(1.05); } 
            10% { opacity: 0; }
            100% { opacity: 0; }
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.25); 
            z-index: 0;
        }

        /* =========================================
           KHỐI NỘI DUNG (HIỆU ỨNG KÍNH MỜ TRONG SUỐT HƠN)
           ========================================= */
        .main-wrapper {
            background-color: rgba(255, 255, 255, 0.05); /* Đã giảm độ đục để nhìn rõ nền */
            backdrop-filter: blur(2px); /* Đã giảm độ nhòe kính */
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3); 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            padding: 40px 30px;
            margin: 40px 20px;
            width: 100%;
            max-width: 500px; 
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.4); 
            font-size: 34px;
            margin: 0 0 5px 0;
        }

        .header p {
            font-size: 16px;
            margin: 0;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            font-weight: 600;
        }

        /* =========================================
           VÒNG QUAY (+10% KÍCH THƯỚC)
           ========================================= */
        .wheel-container {
            position: relative;
            width: 440px; /* Tăng 10% từ 400px lên 440px */
            height: 440px;
            max-width: 90vw; 
            max-height: 90vw;
            margin: 10px auto 35px;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid #FF1493; 
            z-index: 10;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.4));
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            height: 100%;
            transition: transform 4.5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        /* =========================================
           FORM & NÚT BẤM
           ========================================= */
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-bottom: 30px;
        }

        input[type="tel"] {
            padding: 14px 15px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            font-family: 'Quicksand', sans-serif;
            text-align: center;
            font-weight: 600;
        }

        input[type="tel"]:focus {
            border-color: var(--dark-pink);
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }

        button {
            padding: 15px;
            background-color: var(--dark-pink);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Quicksand', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
        }

        button:hover {
            background-color: #E0529C;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .rules-box {
            background-color: rgba(255, 255, 255, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 1.6;
            color: #111;
            font-weight: 600;
        }

        .rules-box h3 {
            margin-top: 0;
            color: #D81B60;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 22px;
        }

        .rules-box ul {
            padding-left: 20px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <!-- KHU VỰC 10 ẢNH NỀN SLIDESHOW -->
    <div class="bg-slideshow">
        <div class="bg-slide slide-1"></div>
        <div class="bg-slide slide-2"></div>
        <div class="bg-slide slide-3"></div>
        <div class="bg-slide slide-4"></div>
        <div class="bg-slide slide-5"></div>
        <div class="bg-slide slide-6"></div>
        <div class="bg-slide slide-7"></div>
        <div class="bg-slide slide-8"></div>
        <div class="bg-slide slide-9"></div>
        <div class="bg-slide slide-10"></div>
    </div>
    <div class="bg-overlay"></div> 

    <!-- KHU VỰC NỘI DUNG -->
    <div class="main-wrapper">
        <div class="header">
            <h1>Aleyna Wedding</h1>
            <p>Dịch vụ Bưng quả & Cho thuê Áo dài TP.HCM</p>
        </div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <!-- Canvas to hơn (540px) để có không gian cho ô quà nổi lên khi hover -->
            <canvas id="wheelCanvas" width="540" height="540"></canvas>
        </div>

        <div class="form-container">
            <input type="tel" id="phoneInput" placeholder="Nhập số điện thoại đã cọc..." required>
            <button id="spinBtn" onclick="startProcess()">Kiểm tra & Quay</button>
        </div>

        <div class="rules-box">
            <h3>Thể Lệ Vòng Quay</h3>
            <ul>
                <li>Mỗi dâu rể chỉ quay được 1 lần (nhập SĐT đã cọc).</li>
                <li>Áp dụng cho hóa đơn từ 999k (Nội Thành HCM).</li>
                <li>Hình ảnh mang tính chất minh họa.</li>
                <li>Quà tặng được freeship đến tận nhà Dâu.</li>
            </ul>
        </div>
    </div>

    <script>
        const SCRIPT_URL = atob('aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J4VklMZnRESWppdXFrTHVoWnlqSlZ2U0MyMlE4TzdkamtVcDQxR2Z3SkthOUhCNFdmMHlFRnBDWnkxWlU4c0pZVlcvZXhlYw==');
        
        const prizes = [
            { text: "Phụ kiện quạt", fullText: "Phụ kiện quạt", img: "1.jpg", weight: 5 },
            { text: "Voucher 50k", fullText: "Voucher 50k", img: "2.jpg", weight: 20 }, // <-- Đã sửa từ 10 thành 20
            { text: "Giảm 5% HĐ", fullText: "Giảm 5% trên tổng hóa đơn", img: "3.jpg", weight: 10 }, // <-- Đã sửa từ 20 thành 10
            { text: "12 bao lì xì", fullText: "12 bao lì xì", img: "4.jpg", weight: 25 },
            { text: "Set Chocolate", fullText: "Set chocolate", img: "5.jpg", weight: 5 },
            { text: "2 Móc khóa", fullText: "2 móc khóa", img: "6.jpg", weight: 20 },
            { text: "Voucher 100k", fullText: "Voucher 100k", img: "7.jpg", weight: 10 },
            { text: "1 Cặp ly sứ", fullText: "1 cặp ly sứ", img: "8.jpg", weight: 5 }
        ];

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const arc = Math.PI / (prizes.length / 2);
        const CX = 270; // Tọa độ trung tâm mới (540/2)
        const CY = 270;

        let hoveredIndex = -1;
        let hasSpun = false; // Trạng thái khóa tương tác khi đang quay/đã quay

        // Tải hình ảnh
        let loadedImages = 0;
        prizes.forEach(prize => {
            prize.imgObj = new Image();
            prize.imgObj.src = prize.img;
            prize.imgObj.onload = () => {
                loadedImages++;
                if (loadedImages === prizes.length) drawWheel();
            };
            prize.imgObj.onerror = () => {
                loadedImages++;
                if (loadedImages === prizes.length) drawWheel(); 
            };
        });
        
        // HÀM VẼ VÒNG QUAY (Có xử lý hiệu ứng Nổi bọt - Hover)
        function drawWheel() {
            ctx.clearRect(0, 0, 540, 540);
            
            // Vẽ vòng nền (các ô bình thường)
            for (let i = 0; i < prizes.length; i++) {
                drawSlice(i, false);
            }
            // Vẽ đè ô đang được Hover lên trên cùng (để nó to hơn và đè lên các ô bên cạnh)
            if (hoveredIndex !== -1 && !hasSpun) {
                drawSlice(hoveredIndex, true);
            }
        }

        function drawSlice(i, isHovered) {
            const angle = i * arc;
            const radius = isHovered ? 265 : 250; // Ô bình thường 250, ô hover phóng lên 265
            
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(CX, CY);
            ctx.arc(CX, CY, radius, angle, angle + arc, false);
            ctx.closePath();
            ctx.clip();
            
            if (prizes[i].imgObj && prizes[i].imgObj.complete && prizes[i].imgObj.naturalWidth > 0) {
                ctx.translate(CX, CY);
                ctx.rotate(angle + arc / 2);
                ctx.drawImage(prizes[i].imgObj, 0, -radius * 0.6, radius, radius * 1.2);
            } else {
                ctx.fillStyle = i % 2 === 0 ? "#FFB6C1" : "#FFF0F5";
                ctx.fill();
            }
            ctx.restore();

            // Vẽ viền
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(CX, CY);
            ctx.arc(CX, CY, radius, angle, angle + arc, false);
            ctx.lineWidth = isHovered ? 8 : 6;
            ctx.strokeStyle = isHovered ? "#FF1493" : "rgba(255, 255, 255, 0.8)"; // Viền hồng rực rỡ khi hover
            ctx.stroke();
            ctx.restore();
            
            // Vẽ Chữ
            ctx.save();
            const textRadius = isHovered ? 180 : 165; // Đẩy chữ ra ngoài một chút khi ô phình to
            ctx.translate(CX + Math.cos(angle + arc / 2) * textRadius, CY + Math.sin(angle + arc / 2) * textRadius);
            ctx.rotate(angle + arc / 2);
            ctx.font = "bold 23px Quicksand";
            ctx.textAlign = "center";
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#FFFFFF";
            ctx.strokeText(prizes[i].text, 0, 8);
            ctx.fillStyle = "#222222";
            ctx.fillText(prizes[i].text, 0, 8);
            ctx.restore();
        }

        // =========================================
        // XỬ LÝ CHUỘT (HOVER & CLICK ĐỂ XEM QUÀ)
        // =========================================
        canvas.addEventListener('mousemove', (e) => {
            if (hasSpun) return; // Không cho tương tác nếu đã quay
            
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / canvas.clientWidth;
            const scaleY = canvas.height / canvas.clientHeight;
            
            // Lấy tọa độ chuột chính xác trên canvas
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            const dx = x - CX;
            const dy = y - CY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist <= 250) {
                let angle = Math.atan2(dy, dx);
                if (angle < 0) angle += 2 * Math.PI;
                let index = Math.floor(angle / arc);
                
                if (hoveredIndex !== index) {
                    hoveredIndex = index;
                    canvas.style.cursor = 'pointer';
                    drawWheel(); // Vẽ lại vòng quay
                }
            } else {
                if (hoveredIndex !== -1) {
                    hoveredIndex = -1;
                    canvas.style.cursor = 'default';
                    drawWheel();
                }
            }
        });

        canvas.addEventListener('mouseleave', () => {
            if (hasSpun) return;
            hoveredIndex = -1;
            canvas.style.cursor = 'default';
            drawWheel();
        });

        canvas.addEventListener('click', () => {
            if (hasSpun || hoveredIndex === -1) return;
            const prize = prizes[hoveredIndex];
            
            // Hiện Popup chi tiết quà khi bấm vào ô
            Swal.fire({
                title: prize.text,
                text: 'Hãy nhập Số điện thoại và bấm Quay để thử vận may nhé!',
                imageUrl: prize.img,
                imageWidth: 200,
                imageHeight: 200,
                imageAlt: prize.text,
                confirmButtonColor: '#FF69B4',
                confirmButtonText: 'Đóng'
            });
        });

        // =========================================
        // THUẬT TOÁN QUAY & GỌI API
        // =========================================
        function getRandomPrizeIndex() {
            let totalWeight = prizes.reduce((sum, prize) => sum + prize.weight, 0);
            let randomNum = Math.random() * totalWeight;
            let weightSum = 0;
            
            for (let i = 0; i < prizes.length; i++) {
                weightSum += prizes[i].weight;
                if (randomNum <= weightSum) {
                    return i;
                }
            }
            return 0;
        }

        async function startProcess() {
            const phone = document.getElementById('phoneInput').value.trim();
            const btn = document.getElementById('spinBtn');
            
            if (!phone) {
                Swal.fire('Lỗi', 'Vui lòng nhập số điện thoại của bạn!', 'error');
                return;
            }

            hasSpun = true; // Khóa tương tác hover/click
            hoveredIndex = -1; 
            drawWheel(); // Trả vòng quay về trạng thái bình thường

            btn.disabled = true;
            btn.innerText = "Đang kiểm tra...";

            const winningIndex = getRandomPrizeIndex();
            const wonPrize = prizes[winningIndex];

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'play', phone: phone, prize: wonPrize.fullText })
                });
                
                const data = await response.json();

                if (data.status === 'success') {
                    btn.innerText = "Đang quay...";
                    spinWheel(winningIndex, wonPrize);
                } else {
                    Swal.fire('Thất bại', data.message, 'warning');
                    hasSpun = false; // Mở lại tương tác nếu lỗi
                    btn.disabled = false;
                    btn.innerText = "Kiểm tra & Quay";
                }
            } catch (error) {
                Swal.fire('Lỗi', 'Không thể kết nối máy chủ. Vui lòng thử lại!', 'error');
                hasSpun = false;
                btn.disabled = false;
                btn.innerText = "Kiểm tra & Quay";
            }
        }

        function spinWheel(winningIndex, prizeObj) {
            const degreesPerSlice = 360 / prizes.length;
            const sliceCenterAngle = winningIndex * degreesPerSlice + (degreesPerSlice / 2);
            const targetDegree = (360 * 8) + 270 - sliceCenterAngle; // Quay 8 vòng rồi dừng

            canvas.style.transform = `rotate(${targetDegree}deg)`;

            setTimeout(() => {
                // Hộp thoại trúng thưởng hiển thị Ảnh quà + Ghi chú nhỏ
                Swal.fire({
                    title: 'Chúc Mừng Dâu Rể!',
                    html: `Phần quà của bạn là: <b>${prizeObj.fullText}</b><br><br><span style="font-size: 14px; color: #888; font-style: italic;">* Quà đã được ghi nhận vào hệ thống</span>`,
                    imageUrl: prizeObj.img,
                    imageWidth: 200,
                    imageHeight: 200,
                    imageAlt: prizeObj.fullText,
                    confirmButtonColor: '#FF69B4',
                    confirmButtonText: 'Tuyệt vời!'
                });
                document.getElementById('spinBtn').innerText = "ĐÃ NHẬN QUÀ";
            }, 4700); 
        }
    </script>
    <!-- =========================================
         THÊM NHẠC NỀN 
         ========================================= -->
    <audio id="bgMusic" loop>
        <source src="nhacnen.mp3" type="audio/mpeg">
    </audio>

    <audio id="bgMusic" loop preload="auto">
        <source src="nhacnen.mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('bgMusic');
        music.volume = 0.5; // Âm lượng 50%

        const startMusic = () => {
            if (music.paused) {
                music.play().catch(() => {});
            }
            // Ngay khi nhạc đã phát, tự động xóa bộ cảm biến để web chạy mượt
            ['click', 'touchstart', 'mousemove', 'scroll'].forEach(evt => 
                document.removeEventListener(evt, startMusic)
            );
        };

        // Kích hoạt ngay khi có BẤT KỲ cử động nhỏ nhất nào của khách hàng
        ['click', 'touchstart', 'mousemove', 'scroll'].forEach(evt => 
            document.addEventListener(evt, startMusic, { once: true })
        );
    </script>
</body>
</html>
