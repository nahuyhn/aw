<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Hợp Đồng - AleynaWedding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: Arial, sans-serif; }
        .hidden { display: none !important; }
        .contract-box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="loginScreen" class="container mt-5" style="max-width: 450px;">
    <div class="contract-box text-center">
        <h3 class="mb-2">AleynaWedding</h3>
        <p class="text-muted mb-4">Hệ Thống Quản Lý Hợp Đồng</p>
        
        <div class="form-floating mb-3" id="urlBox">
            <input type="text" id="apiUrl" class="form-control" placeholder="Link Web App Script" required>
            <label>Link Google Web App</label>
        </div>
        <div class="form-floating mb-4">
            <input type="password" id="adminPass" class="form-control" placeholder="Mật khẩu" required>
            <label>Mật khẩu bảo mật</label>
        </div>
        
        <button class="btn btn-primary w-100 py-2" onclick="login()">ĐĂNG NHẬP</button>
    </div>
</div>

<div id="mainApp" class="container mt-4 hidden">
    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
        <h4 class="m-0 text-primary">📦 Quản Lý Hợp Đồng</h4>
        <div><button class="btn btn-danger btn-sm" onclick="logout()">Đăng xuất</button></div>
    </div>

    <ul class="nav nav-tabs mb-3" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#add">Tạo Hợp Đồng</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#search">Tra Cứu</button></li>
    </ul>

    <div class="tab-content">
        <!-- Tab Thêm HĐ -->
        <div class="tab-pane fade show active contract-box" id="add">
            <form id="contractForm">
                <div class="row">
                    <div class="col-md-3 mb-3"><label class="small">Mã HĐ</label><input type="text" id="maHD" class="form-control" required></div>
                    <div class="col-md-3 mb-3"><label class="small">Ngày Tạo</label><input type="date" id="ngayTao" class="form-control" required></div>
                    <div class="col-md-6 mb-3"><label class="small">Tên Khách Hàng</label><input type="text" id="tenKH" class="form-control" required></div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3"><label class="small">SĐT</label><input type="text" id="sdt" class="form-control" required></div>
                    <div class="col-md-8 mb-3"><label class="small">Địa chỉ</label><input type="text" id="diaChi" class="form-control"></div>
                </div>
                <div class="row">
                    <div class="col-md-3 mb-3"><label class="small">Ngày Lễ</label><input type="text" id="ngayLe" class="form-control"></div>
                    <div class="col-md-3 mb-3"><label class="small">Giờ Có Mặt</label><input type="text" id="gioCoMat" class="form-control"></div>
                    <div class="col-md-3 mb-3"><label class="small">Ngày Lấy Đồ</label><input type="text" id="ngayLay" class="form-control"></div>
                    <div class="col-md-3 mb-3"><label class="small">Ngày Trả Đồ</label><input type="text" id="ngayTra" class="form-control"></div>
                </div>
                <div class="mb-3"><label class="small">Chi Tiết Sản Phẩm/Dịch Vụ</label><textarea id="chiTiet" class="form-control" rows="3"></textarea></div>
                <div class="row">
                    <div class="col-md-4 mb-3"><label class="small">Tổng Tiền</label><input type="number" id="tongTien" class="form-control"></div>
                    <div class="col-md-4 mb-3"><label class="small">Tiền Cọc</label><input type="number" id="tienCoc" class="form-control"></div>
                    <div class="col-md-4 mb-3"><label class="small">Còn Lại</label><input type="number" id="conLai" class="form-control"></div>
                </div>
                <div class="mb-4"><label class="small">Lưu ý / Ghi chú</label><input type="text" id="ghiChu" class="form-control"></div>
                <button type="button" class="btn btn-success w-100 py-2" onclick="submitContract()">LƯU HỢP ĐỒNG</button>
            </form>
            <div id="addResult" class="mt-3 text-center"></div>
        </div>

        <!-- Tab Tra Cứu -->
        <div class="tab-pane fade contract-box" id="search">
            <div class="input-group mb-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Nhập thông tin cần tìm...">
                <button class="btn btn-primary" onclick="searchContract()">Tìm Kiếm</button>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered mt-3">
                    <thead class="table-light"><tr><th>Mã HĐ</th><th>Khách Hàng</th><th>SĐT</th><th>Ngày Lễ</th><th>Tổng Tiền</th><th>Còn Lại</th></tr></thead>
                    <tbody id="searchResults"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const autoUrl = urlParams.get('api');
        if (autoUrl) {
            document.getElementById("apiUrl").value = autoUrl;
            document.getElementById("urlBox").classList.add("hidden"); // Ẩn ô nhập Link
        }
    });

    let appUrl = sessionStorage.getItem("contractApiUrl");
    let appPass = sessionStorage.getItem("contractAppPass");
    if (appUrl && appPass) {
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("mainApp").classList.remove("hidden");
    }

    function login() {
        const url = document.getElementById("apiUrl").value.trim();
        const pass = document.getElementById("adminPass").value.trim();
        if(!url || !pass) return alert("Vui lòng nhập đủ thông tin!");
        sessionStorage.setItem("contractApiUrl", url);
        sessionStorage.setItem("contractAppPass", pass);
        window.location.reload();
    }

    function logout() {
        sessionStorage.removeItem("contractApiUrl");
        sessionStorage.removeItem("contractAppPass");
        window.location.reload();
    }

    async function sendRequest(payload) {
        payload.password = sessionStorage.getItem("contractAppPass"); 
        try {
            const res = await fetch(sessionStorage.getItem("contractApiUrl"), { method: "POST", body: JSON.stringify(payload) });
            const result = await res.json();
            if(!result.success && result.message === "Sai mật khẩu bảo mật!") {
                alert("Sai mật khẩu!"); logout();
            }
            return result;
        } catch (e) { alert("Lỗi kết nối!"); }
    }

    async function submitContract() {
        const data = {
            maHD: document.getElementById("maHD").value, ngayTao: document.getElementById("ngayTao").value,
            tenKH: document.getElementById("tenKH").value, sdt: document.getElementById("sdt").value,
            diaChi: document.getElementById("diaChi").value, ngayLe: document.getElementById("ngayLe").value,
            gioCoMat: document.getElementById("gioCoMat").value, ngayLay: document.getElementById("ngayLay").value,
            ngayTra: document.getElementById("ngayTra").value, chiTiet: document.getElementById("chiTiet").value,
            tongTien: document.getElementById("tongTien").value, tienCoc: document.getElementById("tienCoc").value,
            conLai: document.getElementById("conLai").value, ghiChu: document.getElementById("ghiChu").value
        };
        const res = await sendRequest({ action: "add", contract: data });
        if (res?.success) {
            document.getElementById("addResult").innerHTML = `<div class="alert alert-success">${res.message}</div>`;
            document.getElementById("contractForm").reset();
        }
    }

    async function searchContract() {
        const query = document.getElementById("searchInput").value;
        const res = await sendRequest({ action: "search", query: query });
        if (res?.success) {
            const tbody = document.getElementById("searchResults");
            tbody.innerHTML = res.data.length ? res.data.map(r => `
                <tr><td>${r.MaHD||""}</td><td>${r.TenKhachHang||""}</td><td>${r.SoDienThoai||""}</td>
                <td>${r.NgayLe||""}</td><td>${r.TongTien||""}</td><td class="text-danger">${r.ConLai||""}</td></tr>
            `).join('') : "<tr><td colspan='6' class='text-center'>Không tìm thấy!</td></tr>";
        }
    }
</script>
</body>
</html>
